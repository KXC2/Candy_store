  <!-- Load Bootstrap JS Bundle (includes Popper for tooltips) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // --- Enable Bootstrap Tooltips ---
  // Select all elements with the data-bs-toggle="tooltip" attribute
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');

  // Initialize a tooltip for each element
  [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));

  // Shopping Cart Logic 
  const buttons = document.querySelectorAll('.add-to-cart');

  // Loop through each button and add a click event listener
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {

      const card = btn.closest('.card');

      // Get product name and price from custom data attributes
      const name = card.getAttribute('data-name');
      const price = parseFloat(card.getAttribute('data-price'));

      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      // Add the current item to the cart
      cart.push({ name, price });

      // Save the updated cart back to localStorage
      localStorage.setItem('cart', JSON.stringify(cart));

      // Show confirmation message
      alert(`${name} added to cart!`);
    });
  });
</script>
